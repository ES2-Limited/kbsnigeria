<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="Children studying with a teacher at KBS school">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="640" height="480" fill="#F8FAFC"/>

  <!-- Ground -->
  <path d="M0 360 H640 V480 H0 Z" fill="#E2E8F0"/>

  <!-- School building -->
  <g filter="url(#shadow)">
    <rect x="360" y="120" width="220" height="180" rx="8" fill="#2E3192"/>
    <rect x="390" y="150" width="50" height="50" rx="4" fill="#2DB6E3"/>
    <rect x="455" y="150" width="50" height="50" rx="4" fill="#2DB6E3"/>
    <rect x="520" y="150" width="50" height="50" rx="4" fill="#2DB6E3"/>
    <rect x="430" y="230" width="80" height="70" rx="4" fill="#6C63FF"/>
    <polygon points="350,120 470,60 590,120" fill="#3F51B5"/>
    <rect x="455" y="78" width="30" height="42" rx="2" fill="#2DB6E3"/>
  </g>

  <!-- Tree -->
  <g filter="url(#shadow)">
    <rect x="88" y="250" width="18" height="70" rx="4" fill="#8B5E3C"/>
    <circle cx="97" cy="220" r="42" fill="#6C63FF"/>
    <circle cx="72" cy="245" r="28" fill="#3F51B5"/>
    <circle cx="122" cy="245" r="28" fill="#2DB6E3"/>
  </g>

  <!-- Desk group -->
  <g filter="url(#shadow)">
    <rect x="120" y="285" width="180" height="16" rx="4" fill="#B0B3B8"/>
    <rect x="130" y="301" width="12" height="44" rx="2" fill="#94A3B8"/>
    <rect x="278" y="301" width="12" height="44" rx="2" fill="#94A3B8"/>

    <!-- Books on desk -->
    <rect x="150" y="268" width="36" height="18" rx="2" fill="#2DB6E3"/>
    <rect x="188" y="272" width="30" height="14" rx="2" fill="#6C63FF"/>
    <rect x="220" y="270" width="28" height="16" rx="2" fill="#2E3192"/>
  </g>

  <!-- Teacher -->
  <g filter="url(#shadow)">
    <circle cx="300" cy="198" r="24" fill="#C68642"/>
    <path d="M276 222 C276 250 324 250 324 222 V236 H276 Z" fill="#2E3192"/>
    <rect x="318" y="248" width="56" height="8" rx="4" fill="#2DB6E3"/>
    <circle cx="292" cy="194" r="3" fill="#1E293B"/>
    <circle cx="308" cy="194" r="3" fill="#1E293B"/>
    <path d="M294 206 Q300 212 306 206" stroke="#1E293B" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Child 1 -->
  <g filter="url(#shadow)">
    <circle cx="168" cy="236" r="20" fill="#8D5524"/>
    <path d="M148 256 C148 280 188 280 188 256 V268 H148 Z" fill="#6C63FF"/>
    <circle cx="162" cy="232" r="2.5" fill="#1E293B"/>
    <circle cx="174" cy="232" r="2.5" fill="#1E293B"/>
  </g>

  <!-- Child 2 -->
  <g filter="url(#shadow)">
    <circle cx="228" cy="240" r="18" fill="#E0AC69"/>
    <path d="M210 258 C210 278 246 278 246 258 V268 H210 Z" fill="#2DB6E3"/>
    <circle cx="222" cy="236" r="2.5" fill="#1E293B"/>
    <circle cx="234" cy="236" r="2.5" fill="#1E293B"/>
  </g>

  <!-- Child 3 (standing) -->
  <g filter="url(#shadow)">
    <circle cx="108" cy="248" r="16" fill="#C68642"/>
    <path d="M92 264 C92 284 124 284 124 264 V274 H92 Z" fill="#3F51B5"/>
    <rect x="124" y="258" width="28" height="20" rx="3" fill="#F8FAFC" stroke="#2E3192" stroke-width="2"/>
    <line x1="130" y1="264" x2="146" y2="264" stroke="#2DB6E3" stroke-width="2"/>
    <line x1="130" y1="270" x2="142" y2="270" stroke="#6C63FF" stroke-width="2"/>
  </g>

  <!-- Decorative shapes -->
  <circle cx="520" cy="80" r="10" fill="#2DB6E3" opacity="0.5"/>
  <circle cx="48" cy="96" r="8" fill="#6C63FF" opacity="0.4"/>
  <rect x="560" y="320" width="24" height="24" rx="6" fill="#2DB6E3" opacity="0.35" transform="rotate(12 572 332)"/>
</svg>
